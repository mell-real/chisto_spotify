<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пять треков Spotify</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f9f9fc 0%, #eef1f7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .players-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            max-width: 1200px;
            width: 100%;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 1.6rem 1.6rem 1.8rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25),
                        0 4px 12px rgba(0, 0, 0, 0.05),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .player-card:hover {
            transform: scale(1.005);
        }

        .spotify-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        iframe {
            display: block;
            width: 100%;
            border: none;
            border-radius: 20px;
            background-color: #121212;
        }

        .caption {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            letter-spacing: 0.4px;
            color: #2c3e50;
            opacity: 0.75;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .caption svg {
            width: 18px;
            height: 18px;
            fill: #1DB954;
            opacity: 0.9;
        }

        .track-number {
            display: inline-block;
            background: #1DB954;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
            opacity: 0.85;
        }

        /* адаптивность */
        @media (max-width: 900px) {
            .players-grid {
                grid-template-columns: 1fr;
                gap: 1.6rem;
                max-width: 600px;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 1rem 0.75rem;
            }

            .player-card {
                padding: 1rem 1rem 1.25rem;
                border-radius: 24px;
            }

            .spotify-wrapper {
                border-radius: 16px;
            }

            iframe {
                border-radius: 16px;
            }

            .caption {
                margin-top: 1rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
